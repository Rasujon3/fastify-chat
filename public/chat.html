<!DOCTYPE html>
<html>

<head>
    <title>Chat</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container mt-4">

    <h4>Chat Room</h4>

    <div id="messages" class="border rounded p-3 mb-2" style="height:300px; overflow-y:auto;"></div>

    <input id="message" class="form-control" placeholder="Type a message">
    <button class="btn btn-success mt-2" onclick="sendMessage()">Send</button>

    <hr>

    <button class="btn btn-danger btn-sm" onclick="logout()">Logout</button>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/chat.js"></script>
</body>

</html>
